<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Linkincrease · Access route test</title>
  <link rel="stylesheet" href="./styles.css?v=31">
  <script src="./config.js?v=31" defer></script>
  <script src="./app.js?v=31" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the test guide</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Linkincrease access route test">
      <span class="brand-logo" aria-hidden="true"></span>
      <span class="sr-only">Linkincrease</span>
    </a>
    <div class="header-actions">
      <span class="header-note" id="header-note"></span>
      <button id="language" class="language-button" type="button">中文</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <p class="eyebrow" id="nav-eyebrow"></p>
      <h2 id="nav-title"></h2>
      <p class="nav-description" id="nav-description"></p>
      <nav id="navigation" aria-label="Test stages"></nav>
      <div class="sidebar-note">
        <span class="small-dot" aria-hidden="true"></span>
        <p id="sidebar-note"></p>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <div class="progress-sticky">
        <div class="stage-meta">
          <span id="section-label"></span>
          <span id="progress-label"></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Rated test steps" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
      </div>
      <div id="setup-warning" class="notice notice-warning" hidden></div>
      <div id="content"></div>
      <div id="feedback" class="feedback" role="alert" tabindex="-1" hidden></div>
      <div id="actions" class="actions"></div>
      <footer class="page-footer">
        <span id="draft-status" role="status" aria-live="polite"></span>
        <button type="button" id="clear" class="text-button"></button>
      </footer>
    </main>
  </div>

  <noscript><p class="notice">Please enable JavaScript to complete this test. 请启用 JavaScript 后继续。</p></noscript>
</body>
</html>
